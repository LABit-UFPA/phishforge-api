services:
  phishforge-postgresql:
    image: postgres:16.4
    container_name: phishforge-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: phishforge
      POSTGRES_USER: phishforge
      POSTGRES_PASSWORD: phishforge
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # A porta NAO e publicada no host de proposito: o phishing-quest-api
    # tambem usa 5432 e os dois stacks precisam subir juntos para
    # desenvolver a integracao. O acesso e pela rede do compose; para
    # inspecionar o banco, use `docker exec -it phishforge-postgresql psql -U phishforge`.
    networks:
      - phishforge_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishforge -d phishforge"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  phishforge-qdrant:
    # Versao fixa (nao `latest`): e a versao que gerou
    # qdrant/phishing_articles.snapshot, e fixar mantem a base vetorial
    # reproduzivel entre maquinas.
    image: qdrant/qdrant:v1.18.0
    container_name: phishforge-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
    networks:
      - phishforge_network
    healthcheck:
      # A imagem nao tem curl/wget; bash + /dev/tcp basta.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Carga inicial da base vetorial: restaura a colecao `phishing_articles`
  # (os artigos de data/articles ja indexados, 800 pontos, embeddings
  # text-embedding-3-small) a partir de qdrant/phishing_articles.snapshot.
  # Roda uma vez e sai. So restaura se a colecao NAO existir -- nunca
  # sobrescreve uma base ja indexada (ex.: reindexada com
  # script/run_ingestion.py). Para voltar ao snapshot: apague a colecao
  # (ou `docker compose down -v`) e suba de novo.
  #
  # Nao usa `qdrant --snapshot` no proprio servico: esse modo entra em
  # panico ("Collection already exists") em todo restart depois do
  # primeiro, e com --force-snapshot sobrescreveria a base a cada subida.
  phishforge-qdrant-seed:
    image: curlimages/curl:8.10.1
    container_name: phishforge-qdrant-seed
    volumes:
      - ./qdrant:/seed:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        if curl -sf http://phishforge-qdrant:6333/collections/phishing_articles > /dev/null; then
          echo "Colecao phishing_articles ja existe -- nada a restaurar."
          exit 0
        fi
        echo "Restaurando phishing_articles a partir do snapshot..."
        curl -sf -X POST "http://phishforge-qdrant:6333/collections/phishing_articles/snapshots/upload?priority=snapshot&wait=true" \
          -F "snapshot=@/seed/phishing_articles.snapshot"
    networks:
      - phishforge_network
    depends_on:
      phishforge-qdrant:
        condition: service_healthy

  phishforge-flyway:
    # 10.22.0 e multiplataforma (amd64/arm64): a 7.0.2 so existia para
    # amd64 e rodava emulada em Mac Apple Silicon / Windows ARM (e nem
    # roda em Linux ARM sem emulacao). Testado: migra um banco do zero e
    # valida sem erro de checksum um banco ja migrado pela 7.0.2.
    image: flyway/flyway:10.22.0
    container_name: phishforge-flyway
    command: >
      -configFiles=/flyway/conf/flyway.config
      -locations=filesystem:/flyway/sql
      -connectRetries=60
      migrate
    volumes:
      - ./migrate/changelogs:/flyway/sql
      - ./migrate/flyway.config:/flyway/conf/flyway.config
    networks:
      - phishforge_network
    depends_on:
      phishforge-postgresql:
        condition: service_healthy

  phishforge-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phishforge-api
    restart: unless-stopped
    ports:
      # So loopback: com a API_KEY padrao de ambiente local (abaixo),
      # publicar em todas as interfaces deixaria qualquer um da rede
      # gastar a chave da OpenAI. O frontend e o backend Go chegam pela
      # rede do compose, nao por esta porta.
      - "127.0.0.1:8000:8000"
    environment:
      QDRANT_URL: http://phishforge-qdrant:6333
      DB_HOST: phishforge-postgresql
      DB_PORT: 5432
      DB_USER: phishforge
      DB_PASSWORD: phishforge
      DB_NAME: phishforge
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Modelo e temperatura da geracao (lote-piloto de 26/10/2026). O
      # .env nao entra na imagem, entao sem estas linhas o container
      # ignorava o MODEL_NAME_LLM do .env e rodava sempre o default do
      # codigo -- fixar o snapshot no .env nao tinha efeito nenhum.
      MODEL_NAME_LLM: ${MODEL_NAME_LLM:-gpt-4o-mini}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      # Anotacao as cegas das pistas (2a chamada de LLM por item).
      ANOTACAO_CEGA: ${ANOTACAO_CEGA:-true}
      # Issue #7: autenticacao entre servicos. Este compose e ambiente
      # LOCAL: sem API_KEY no .env, usa um valor padrao conhecido para
      # o gerador funcionar de primeira (o nginx do frontend injeta a
      # mesma chave). Por isso API e frontend so escutam em loopback.
      # Fora do ambiente local, defina API_KEY no .env
      # (`openssl rand -hex 32`).
      API_KEY: ${API_KEY:-phishforge-local}
      # Modulo de avaliacao por especialistas (issues #36-#38). Sem
      # EXPERT_JWT_SECRET / RESEARCHER_API_KEY as rotas /expert e /researcher
      # respondem 503 (falha fechado). Gere com `openssl rand -hex 32`.
      EXPERT_JWT_SECRET: ${EXPERT_JWT_SECRET:-}
      RESEARCHER_API_KEY: ${RESEARCHER_API_KEY:-}
      # Origem publica do frontend: monta o link de acesso do especialista.
      EXPERT_FRONTEND_URL: ${EXPERT_FRONTEND_URL:-http://localhost:3000}
      # Itens exigidos para abrir uma rodada (10/10/10). Piloto menor: reduza.
      RODADA_ITENS_ESPERADOS: ${RODADA_ITENS_ESPERADOS:-30}
    networks:
      - phishforge_network
    depends_on:
      phishforge-postgresql:
        condition: service_healthy
      phishforge-qdrant:
        condition: service_healthy
      phishforge-qdrant-seed:
        condition: service_completed_successfully
      phishforge-flyway:
        condition: service_completed_successfully

  phishforge-frontend:
    build:
      context: ../phishforge-frontend
      dockerfile: Dockerfile
      args:
        # Vazio = same-origin: o nginx do frontend faz proxy de /api/v1/expert e
        # /api/v1/researcher para a API (ver phishforge-frontend/README.md).
        # `expert` limita o build a /avaliacao/*; `full` registra todas as rotas.
        VITE_API_BASE_URL: ""
        VITE_APP_MODE: full
    environment:
      API_UPSTREAM: http://phishforge-api:8000
      # Ambiente LOCAL: a curadoria (gerador/exemplos) tambem passa pelo proxy,
      # com a API_KEY injetada pelo nginx (fora do bundle). Qualquer um que
      # alcance a porta pode gerar/apagar itens, por isso ela so escuta em
      # loopback. Em producao: CURATION_ENABLED=0 e sem publicar em rede aberta.
      CURATION_ENABLED: ${CURATION_ENABLED:-1}
      CURATION_API_KEY: ${API_KEY:-phishforge-local}
    container_name: phishforge-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - phishforge_network
    depends_on:
      - phishforge-api

  # Exporta os exemplos gerados para CSV em ./exports (exemplos.csv e
  # pistas.csv), para analise fora do sistema. Nao sobe com `up`
  # (profile `export`); roda sob demanda e sai:
  #   docker compose run --rm phishforge-export
  # Usa o psql da propria imagem do Postgres: funciona igual em Linux,
  # macOS e Windows, sem psql instalado e sem redirecionamento de shell.
  phishforge-export:
    image: postgres:16.4
    container_name: phishforge-export
    profiles: ["export"]
    environment:
      PGPASSWORD: phishforge
    volumes:
      - ./script/exportar_exemplos.sql:/sql/exportar_exemplos.sql:ro
      - ./exports:/exports
    command: >
      psql -h phishforge-postgresql -U phishforge -d phishforge
      -v ON_ERROR_STOP=1 -f /sql/exportar_exemplos.sql
    networks:
      - phishforge_network
    depends_on:
      phishforge-postgresql:
        condition: service_healthy

networks:
  phishforge_network:
    name: phishforge_network
    driver: bridge

volumes:
  postgres_data:
    name: phishforge_postgres_data
  qdrant_data:
    name: phishforge_qdrant_data
